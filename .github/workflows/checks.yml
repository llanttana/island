name: checks

# Everything here runs without Omarchy, which is why `omarchy plugin validate`
# and tests/smoke.sh are not part of it: the first only exists inside an Omarchy
# install and the second needs a live session. tests/checks.sh skips a tool it
# cannot find instead of failing, so a bare runner still gets every other check.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    # Pinned rather than latest: the check set depends on the packages this
    # image ships, and that should not change under the repository's feet.
    runs-on: ubuntu-24.04
    # The whole run takes well under a minute; this is only here so a hung apt
    # or a stuck lint cannot sit for the six hours GitHub allows by default.
    timeout-minutes: 10
    steps:
      # The source comes as an archive, not through actions/checkout: a clone
      # in CI lands in the repository's clone graph and makes "how many people
      # actually installed this" unreadable. tests/checks.sh lists tracked
      # *.qml and checks staged whitespace, so a git index is made locally.
      - name: Fetch the source
        run: |
          curl -sSL "https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz" | tar -xz --strip-components=1
          git init -q .
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "source ${GITHUB_SHA}"

      # qmllint lives here. shellcheck and jq are already on the runner.
      - name: Install qmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools
          # Debian puts it in /usr/lib/qt6/bin, which is not on PATH.
          printf '/usr/lib/qt6/bin\n' >> "$GITHUB_PATH"
          /usr/lib/qt6/bin/qmllint --version

      # The same script a developer runs, so the two cannot drift apart. The
      # runner has no Quickshell, so the QML step is asked for syntax only:
      # anything beyond that needs the types, and those are checked locally.
      - name: Run the checks
        env:
          ISLAND_LINT_SYNTAX_ONLY: "1"
        run: bash tests/checks.sh
